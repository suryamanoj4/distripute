[project]
name = "distripute"
version = "0.1.0"
description = "Distributed inference system for ASR, OCR, and LLM tasks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.9",
    "click>=8.0",
]

[project.scripts]
distripute-master = "distripute.master:main"
distripute-worker = "distripute.worker:main"
distripute-cli = "distripute.cli:main"
distripute = "distripute.cli:main"

[tool.uv]
dev-dependencies = [
    "openai-whisper",
    "paddlepaddle",
    "paddleocr",
]
