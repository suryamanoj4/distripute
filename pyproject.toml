[project]
name = "distripute"
version = "0.1.0"
description = "Distributed inference system for ASR, OCR, and LLM tasks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.9",
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.scripts]
distripute-master = "distripute.master:main"
distripute-worker = "distripute.worker:main"
distripute-relay = "distripute.relay:main"
distripute-cli = "distripute.cli:main"
distripute = "distripute.cli:cli"

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["distripute*"]
exclude = ["plugins*", "tests*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-aiohttp>=1.0",
    "psutil>=5.0",
]
